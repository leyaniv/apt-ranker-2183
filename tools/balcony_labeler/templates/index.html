<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Balcony Labeler</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2128;
      --panel-2: #232c35;
      --border: #2a3540;
      --text: #d8dee4;
      --muted: #8b97a3;
      --accent: #4a9eff;
      --accent-2: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px; }
    .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
    /* ---------------- Sidebar ---------------- */
    .sidebar { background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 0; }
    .sidebar h1 { font-size: 14px; margin: 0; padding: 14px 16px;
      border-bottom: 1px solid var(--border); font-weight: 600;
      display: flex; justify-content: space-between; align-items: center; }
    .progress { display: flex; flex-direction: column; gap: 6px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: var(--panel-2); }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px;
      overflow: hidden; }
    .progress-bar > div { height: 100%; background: var(--accent);
      transition: width 0.2s; }
    .progress-text { font-size: 12px; color: var(--muted);
      display: flex; justify-content: space-between; }
    .group-list { flex: 1; overflow-y: auto; }
    .group-item { padding: 8px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: background 0.1s; }
    .group-item:hover { background: var(--panel-2); }
    .group-item.active { background: var(--accent-2); color: white; }
    .group-status { width: 16px; flex-shrink: 0; text-align: center;
      font-size: 12px; }
    .group-status.done { color: var(--green); }
    .group-status.pending { color: var(--muted); }
    .group-item.active .group-status { color: white; }
    .group-name { flex: 1; font-weight: 500; }
    .group-meta { font-size: 11px; color: var(--muted); }
    .group-item.active .group-meta { color: rgba(255,255,255,0.8); }
    .group-balconies { font-size: 11px; color: var(--muted); direction: rtl;
      text-align: right; max-width: 100px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .group-item.active .group-balconies { color: rgba(255,255,255,0.85); }
    .filter-bar { padding: 8px 12px; border-bottom: 1px solid var(--border);
      background: var(--panel-2); display: flex; gap: 6px; }
    .filter-bar button { background: var(--border); color: var(--text);
      border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px;
      cursor: pointer; }
    .filter-bar button.on { background: var(--accent); color: white; }

    /* ---------------- Main panel ---------------- */
    .main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
    .header { padding: 12px 20px; border-bottom: 1px solid var(--border);
      background: var(--panel); display: flex; gap: 24px; align-items: center;
      flex-wrap: wrap; }
    .header .title { font-size: 18px; font-weight: 600; }
    .header .meta { color: var(--muted); font-size: 13px; }
    .header .meta strong { color: var(--text); font-weight: 500; }
    .header .meta .he { direction: rtl; unicode-bidi: embed; }

    .plan-wrap { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    .plan-toolbar { background: var(--panel-2); border-bottom: 1px solid var(--border);
      padding: 6px 12px; display: flex; gap: 6px; align-items: center;
      font-size: 12px; color: var(--muted); }
    .plan-toolbar button { background: var(--panel); color: var(--text);
      border: 1px solid var(--border); padding: 3px 10px; border-radius: 4px;
      cursor: pointer; font-size: 12px; min-width: 32px; }
    .plan-toolbar button:hover { background: var(--border); }
    .zoom-pct { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums;
      color: var(--text); }
    .plan { overflow: auto; background: #f8f8f8;
      padding: 16px; min-height: 0;
      cursor: grab; }
    .plan.dragging { cursor: grabbing; }
    .plan-inner { display: block; min-height: 100%; }
    .page-block { margin-top: 16px; }
    .page-block:first-child { margin-top: 0; }
    .page-label { font-size: 11px; color: #555; padding: 4px 0;
      text-align: center; font-weight: 500; letter-spacing: 0.3px; }
    .plan img { height: auto; box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      background: white; max-width: none; user-select: none;
      -webkit-user-drag: none; pointer-events: none;
      display: block; margin: 0 auto; }
    .plan .empty { color: var(--muted); padding: 40px; text-align: center; }

    /* ---------------- Editor ---------------- */
    .editor { background: var(--panel); border-top: 1px solid var(--border);
      padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
    .editor h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--muted); margin: 0; font-weight: 600; }
    .balconies-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .balcony-card { background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px; display: flex;
      flex-direction: column; gap: 6px; }
    .balcony-card .head { display: flex; align-items: center; gap: 8px;
      justify-content: space-between; }
    .balcony-card .label { color: var(--muted); font-size: 12px;
      letter-spacing: 0.3px; }
    .dir-grid { display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 32px);
      gap: 3px; }
    .dir-btn { background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      cursor: pointer; font-size: 12px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.1s; line-height: 1; }
    .dir-btn:hover { background: var(--border); }
    .dir-btn.selected { background: var(--accent); color: white;
      border-color: var(--accent); }
    .dir-btn.center { background: transparent; border: 1px dashed var(--border);
      color: var(--muted); cursor: default; font-size: 14px; }
    .dir-btn.center:hover { background: transparent; }
    .delete-btn { background: transparent; border: 1px solid var(--border);
      color: var(--red); padding: 2px 8px; border-radius: 4px; cursor: pointer;
      font-size: 14px; line-height: 1; }
    .delete-btn:hover { background: var(--red); color: white; }
    .add-btn { background: var(--panel-2); border: 1px dashed var(--border);
      color: var(--muted); padding: 6px 10px; border-radius: 4px; cursor: pointer;
      font-size: 12px; align-self: flex-start; }
    .add-btn:hover { background: var(--border); color: var(--text); }
    .footer { display: flex; gap: 8px; align-items: center;
      padding-top: 8px; border-top: 1px solid var(--border); margin-top: 4px; }
    .nav-btn { background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); padding: 8px 14px; border-radius: 4px;
      cursor: pointer; font-size: 13px; }
    .nav-btn:hover { background: var(--border); }
    .nav-btn.primary { background: var(--accent); border-color: var(--accent);
      color: white; }
    .nav-btn.primary:hover { background: var(--accent-2); }
    .save-status { color: var(--muted); font-size: 11px; margin-left: auto; }
    .save-status.saved { color: var(--green); }
    .save-status.error { color: var(--red); }
    .notes { background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px;
      font-size: 13px; flex: 1; min-width: 180px; font-family: inherit; }
    .pill { display: inline-block; background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 2px 8px; font-size: 11px; margin-right: 4px; }
    .pill.he { direction: rtl; unicode-bidi: embed; }
    .lot-pill { display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 12px; margin-right: 4px; background: var(--panel-2);
      border: 1px solid var(--border); }
    .lot-pill .lot-num { color: var(--muted); margin-right: 4px;
      font-variant-numeric: tabular-nums; }
    .lot-pill .he { direction: rtl; unicode-bidi: embed; color: var(--text);
      font-weight: 500; }
    .warn { color: var(--yellow); font-weight: 600; margin-left: 8px;
      font-size: 12px; }
  </style>
</head>
<body>
<div class="app">

  <!-- ============== Sidebar ============== -->
  <div class="sidebar">
    <h1>Balcony Labeler <span id="hint" style="color: var(--muted); font-weight: normal; font-size: 11px;">↑↓ nav · numpad to set dir</span></h1>
    <div class="progress">
      <div class="progress-text">
        <span id="progress-label">0 / 0</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar"><div id="progress-fill" style="width: 0%"></div></div>
    </div>
    <div class="filter-bar">
      <button id="filter-all" class="on" data-filter="all">All</button>
      <button id="filter-pending" data-filter="pending">Pending</button>
      <button id="filter-done" data-filter="done">Done</button>
    </div>
    <div class="group-list" id="group-list"></div>
  </div>

  <!-- ============== Main ============== -->
  <div class="main">
    <div class="header">
      <div class="title" id="title">—</div>
      <div class="meta">
        <span>Lots: <strong id="lots">—</strong></span>
        &nbsp;·&nbsp;
        <span>Rooms: <strong id="rooms">—</strong></span>
        &nbsp;·&nbsp;
        <span>Area: <strong id="area">—</strong></span>
        &nbsp;·&nbsp;
        <span>Balcony: <strong id="balcony-area">—</strong></span>
        &nbsp;·&nbsp;
        <span>Apts: <strong id="apt-count">—</strong></span>
      </div>
      <div class="meta">
        Contractor air-direction: <span id="air-dir-block">—</span>
      </div>
    </div>

    <div class="plan-wrap">
      <div class="plan-toolbar">
        <button type="button" id="zoom-out" title="Zoom out (Ctrl + -)">−</button>
        <span class="zoom-pct" id="zoom-pct">100%</span>
        <button type="button" id="zoom-in" title="Zoom in (Ctrl + +)">+</button>
        <button type="button" id="zoom-reset" title="Reset to 100%">Reset</button>
        <button type="button" id="zoom-fit" title="Fit width">Fit</button>
        <span style="margin-left: auto; opacity: 0.7;">drag to pan · ctrl+wheel to zoom</span>
      </div>
      <div class="plan" id="plan">
        <div class="plan-inner" id="plan-inner">
          <div class="empty">Select a group from the left to begin.</div>
        </div>
      </div>
    </div>

    <div class="editor">
      <h3>Balconies — direction the entrance faces</h3>
      <div id="balconies"></div>
      <button class="add-btn" id="add-balcony" type="button">+ Add another balcony</button>
      <div class="footer">
        <button class="nav-btn" id="prev-btn" type="button">← Prev</button>
        <button class="nav-btn primary" id="next-btn" type="button">Save & Next →</button>
        <input class="notes" id="notes" type="text" placeholder="Notes (optional)…">
        <span class="save-status" id="save-status"></span>
      </div>
    </div>
  </div>
</div>

<script>
const GROUPS = {{ groups|tojson }};
const DIRECTIONS = {{ directions|tojson }};
const RESULTS = {{ results|tojson }};

let currentIdx = 0;
let filter = 'all';
let saveTimer = null;

function isDone(g) {
  const r = RESULTS[g.id];
  return !!(r && r.balconies && r.balconies.length > 0);
}

function visibleGroups() {
  if (filter === 'pending') return GROUPS.filter(g => !isDone(g));
  if (filter === 'done')    return GROUPS.filter(g =>  isDone(g));
  return GROUPS;
}

function renderSidebar() {
  const list = document.getElementById('group-list');
  list.innerHTML = '';
  const vg = visibleGroups();
  vg.forEach(g => {
    const item = document.createElement('div');
    item.className = 'group-item';
    if (g.id === GROUPS[currentIdx].id) item.classList.add('active');
    const done = isDone(g);
    const r = RESULTS[g.id];
    const balcSummary = (r && r.balconies && r.balconies.length)
      ? r.balconies.join(' · ') : '';
    item.innerHTML = `
      <span class="group-status ${done ? 'done' : 'pending'}">${done ? '✓' : '○'}</span>
      <div class="group-name">B${g.building} · ${escapeHtml(g.type)}
        <div class="group-meta">${g.apartment_count} apt${g.apartment_count > 1 ? 's' : ''}</div>
      </div>
      <div class="group-balconies" dir="rtl">${escapeHtml(balcSummary)}</div>
    `;
    item.addEventListener('click', () => {
      const idx = GROUPS.findIndex(x => x.id === g.id);
      if (idx >= 0) { currentIdx = idx; renderAll(); }
    });
    list.appendChild(item);
  });
  // Scroll active into view
  const activeEl = list.querySelector('.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

function renderProgress() {
  const total = GROUPS.length;
  const done = GROUPS.filter(isDone).length;
  document.getElementById('progress-label').textContent = `${done} / ${total}`;
  const pct = total ? Math.round(100 * done / total) : 0;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function renderHeader() {
  const g = GROUPS[currentIdx];
  document.getElementById('title').textContent = `Building ${g.building} · Type ${g.type}`;
  document.getElementById('lots').textContent = (g.lots || []).join(', ') || '—';
  document.getElementById('rooms').textContent = (g.rooms || []).join(', ') || '—';
  document.getElementById('area').textContent = (g.areas || []).map(a => a.toFixed(1) + ' m²').join(', ') || '—';
  document.getElementById('balcony-area').textContent = (g.balcony_areas || []).map(a => a.toFixed(2) + ' m²').join(', ') || '—';
  document.getElementById('apt-count').textContent = g.apartment_count;
  renderAirDirection(g);
}

function renderAirDirection(g) {
  const root = document.getElementById('air-dir-block');
  root.innerHTML = '';
  const byLot = g.air_directions_by_lot || [];
  if (byLot.length === 0) {
    root.textContent = '—';
    return;
  }
  byLot.forEach(entry => {
    const pill = document.createElement('span');
    pill.className = 'lot-pill';
    pill.innerHTML = `<span class="lot-num">${escapeHtml(entry.lot)}</span>` +
      `<span class="he">${entry.air_directions.map(escapeHtml).join(' / ')}</span>`;
    root.appendChild(pill);
  });
  if (g.air_direction_disagrees) {
    const warn = document.createElement('span');
    warn.className = 'warn';
    warn.title = 'These lots have different air_directions for the same '
      + '(building, type) — the buildings may be rotated differently. '
      + 'Verify the balcony direction separately for each lot before trusting this label.';
    warn.textContent = '⚠ lots disagree';
    root.appendChild(warn);
  }
}

function renderPlan() {
  const g = GROUPS[currentIdx];
  const inner = document.getElementById('plan-inner');
  if (!g.rep_pdf_exists) {
    inner.innerHTML = '<div class="empty">PDF not on disk for this group.<br><br>'
      + 'Try running the scraper without <code>--skip-pdfs</code> to download apartment plans.</div>';
    return;
  }
  const n = Math.max(1, g.page_count || 1);
  const stamp = Date.now();
  let html = '';
  for (let i = 0; i < n; i++) {
    html += `<div class="page-block">`;
    if (n > 1) html += `<div class="page-label">Page ${i + 1} / ${n}</div>`;
    html += `<img src="/render/${encodeURIComponent(g.id)}.png?page=${i}&t=${stamp}" `
         +  `alt="Apartment plan page ${i + 1}">`;
    html += `</div>`;
  }
  inner.innerHTML = html;
  applyZoom();
  // Reset scroll to the top of the plan whenever we switch groups, so the
  // user starts looking at page 1.
  document.getElementById('plan').scrollTop = 0;
  document.getElementById('plan').scrollLeft = 0;
}

// Map direction key to (col, row) inside the 3x3 grid.
// Mirrors the numpad layout:  7 8 9 / 4 _ 6 / 1 2 3
const GRID_POSITIONS = {
  'NW': [0, 0], 'N':  [1, 0], 'NE': [2, 0],
  'W':  [0, 1],               'E':  [2, 1],
  'SW': [0, 2], 'S':  [1, 2], 'SE': [2, 2],
};
// Numpad → direction key (5 is the center, no-op).
const NUMPAD_TO_KEY = {
  '7': 'NW', '8': 'N', '9': 'NE',
  '4': 'W',            '6': 'E',
  '1': 'SW', '2': 'S', '3': 'SE',
};

function renderEditor() {
  const g = GROUPS[currentIdx];
  const r = RESULTS[g.id] || { balconies: [], notes: '' };
  const balcs = (r.balconies && r.balconies.length) ? [...r.balconies] : [null];
  const root = document.getElementById('balconies');
  root.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'balconies-row';
  balcs.forEach((dir, i) => {
    wrap.appendChild(makeBalconyCard(i + 1, dir));
  });
  root.appendChild(wrap);
  document.getElementById('notes').value = r.notes || '';
}

function makeBalconyCard(num, currentDir) {
  const card = document.createElement('div');
  card.className = 'balcony-card';
  card.dataset.balconyNum = num;

  const head = document.createElement('div');
  head.className = 'head';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = `Balcony ${num}`;
  head.appendChild(label);
  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'delete-btn';
  del.title = 'Remove this balcony';
  del.textContent = '×';
  del.addEventListener('click', () => {
    card.remove();
    renumberBalconies();
    scheduleSave();
  });
  head.appendChild(del);
  card.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'dir-grid';

  // Build all 9 cells in row-major order; center cell is non-clickable.
  const cells = [
    'NW', 'N',  'NE',
    'W',  null, 'E',
    'SW', 'S',  'SE',
  ];
  cells.forEach(key => {
    if (key === null) {
      const c = document.createElement('div');
      c.className = 'dir-btn center';
      c.textContent = '×';
      c.title = 'apartment';
      grid.appendChild(c);
      return;
    }
    const d = DIRECTIONS.find(x => x.key === key);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dir-btn';
    b.dataset.key = key;
    b.dataset.dir = d.label;
    b.title = `${d.abbr} (${d.label})`;
    b.textContent = d.abbr;
    if (d.label === currentDir) b.classList.add('selected');
    b.addEventListener('click', () => {
      grid.querySelectorAll('.dir-btn:not(.center)').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      scheduleSave();
    });
    grid.appendChild(b);
  });
  card.appendChild(grid);
  return card;
}

function renumberBalconies() {
  document.querySelectorAll('.balcony-card').forEach((c, i) => {
    c.dataset.balconyNum = i + 1;
    c.querySelector('.label').textContent = `Balcony ${i + 1}`;
  });
}

function collectBalconies() {
  const cards = document.querySelectorAll('.balcony-card');
  const out = [];
  cards.forEach(c => {
    const sel = c.querySelector('.dir-btn.selected');
    if (sel) out.push(sel.dataset.dir);
  });
  return out;
}

// ---------------- Zoom + pan ----------------

let zoom = 1.0;

function applyZoom() {
  document.querySelectorAll('#plan img').forEach(img => {
    img.style.width = (zoom * 100) + '%';
  });
  const lbl = document.getElementById('zoom-pct');
  if (lbl) lbl.textContent = Math.round(zoom * 100) + '%';
}

function setZoom(z) {
  zoom = Math.max(0.2, Math.min(6.0, z));
  applyZoom();
}

document.getElementById('zoom-in')   .addEventListener('click', () => setZoom(zoom * 1.25));
document.getElementById('zoom-out')  .addEventListener('click', () => setZoom(zoom / 1.25));
document.getElementById('zoom-reset').addEventListener('click', () => setZoom(1.0));
document.getElementById('zoom-fit')  .addEventListener('click', () => setZoom(1.0));

// Ctrl+wheel zoom, centered on cursor
const planEl = document.getElementById('plan');
planEl.addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const rect = planEl.getBoundingClientRect();
  const mx = e.clientX - rect.left + planEl.scrollLeft;
  const my = e.clientY - rect.top  + planEl.scrollTop;
  const prev = zoom;
  setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
  const ratio = zoom / prev;
  planEl.scrollLeft = mx * ratio - (e.clientX - rect.left);
  planEl.scrollTop  = my * ratio - (e.clientY - rect.top);
}, { passive: false });

// Click-drag panning
let isDragging = false, dragStartX = 0, dragStartY = 0, dragScrollX = 0, dragScrollY = 0;
planEl.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  isDragging = true;
  planEl.classList.add('dragging');
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragScrollX = planEl.scrollLeft;
  dragScrollY = planEl.scrollTop;
  e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  planEl.scrollLeft = dragScrollX - (e.clientX - dragStartX);
  planEl.scrollTop  = dragScrollY - (e.clientY - dragStartY);
});
window.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  planEl.classList.remove('dragging');
});

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  setSaveStatus('saving…', '');
  saveTimer = setTimeout(doSave, 250);
}

async function doSave() {
  const g = GROUPS[currentIdx];
  const balconies = collectBalconies();
  const notes = document.getElementById('notes').value;
  try {
    const resp = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group_id: g.id, balconies, notes }),
    });
    const j = await resp.json();
    if (j.ok) {
      // Update local results cache
      if (balconies.length || notes) {
        RESULTS[g.id] = { building: g.building, type: g.type,
          balconies, notes, labeled_at: new Date().toISOString() };
      } else {
        delete RESULTS[g.id];
      }
      setSaveStatus('saved', 'saved');
      renderProgress();
      renderSidebar();
    } else {
      setSaveStatus('save failed: ' + (j.error || ''), 'error');
    }
  } catch (e) {
    setSaveStatus('save error: ' + e.message, 'error');
  }
}

function setSaveStatus(text, cls) {
  const el = document.getElementById('save-status');
  el.textContent = text;
  el.className = 'save-status ' + (cls || '');
}

function renderAll() {
  renderHeader();
  renderPlan();
  renderEditor();
  renderProgress();
  renderSidebar();
}

function go(delta) {
  let next = currentIdx + delta;
  if (next < 0) next = 0;
  if (next >= GROUPS.length) next = GROUPS.length - 1;
  currentIdx = next;
  renderAll();
}

function jumpToNextPending() {
  for (let i = currentIdx + 1; i < GROUPS.length; i++) {
    if (!isDone(GROUPS[i])) { currentIdx = i; renderAll(); return; }
  }
  // Wrap around
  for (let i = 0; i < currentIdx; i++) {
    if (!isDone(GROUPS[i])) { currentIdx = i; renderAll(); return; }
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Event wiring ---
document.getElementById('add-balcony').addEventListener('click', () => {
  // The cards live inside a `.balconies-row` flex container that
  // `renderEditor` creates; if it isn't there yet (e.g. group with no
  // balconies has been edited away) re-render to make sure it exists.
  let row = document.querySelector('#balconies .balconies-row');
  if (!row) {
    renderEditor();
    row = document.querySelector('#balconies .balconies-row');
    if (!row) return;
  }
  const num = row.querySelectorAll('.balcony-card').length + 1;
  row.appendChild(makeBalconyCard(num, null));
});

document.getElementById('prev-btn').addEventListener('click', () => go(-1));
document.getElementById('next-btn').addEventListener('click', () => {
  // Save synchronously, then jump to next pending
  doSave().then(jumpToNextPending);
});
document.getElementById('notes').addEventListener('input', scheduleSave);

document.querySelectorAll('.filter-bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    filter = btn.dataset.filter;
    renderSidebar();
  });
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  // Ctrl + / - / 0  for zoom
  if (e.ctrlKey && (e.key === '+' || e.key === '=')) { setZoom(zoom * 1.25); e.preventDefault(); return; }
  if (e.ctrlKey && (e.key === '-' || e.key === '_')) { setZoom(zoom / 1.25); e.preventDefault(); return; }
  if (e.ctrlKey && (e.key === '0' || e.key === ')'))  { setZoom(1.0); e.preventDefault(); return; }

  if (e.key === 'ArrowUp')   { go(-1); e.preventDefault(); return; }
  if (e.key === 'ArrowDown') { go(1);  e.preventDefault(); return; }
  if (e.key === 'Enter')     { doSave().then(jumpToNextPending); e.preventDefault(); return; }
  if (e.key === 'a' || e.key === '+') {
    document.getElementById('add-balcony').click(); e.preventDefault(); return;
  }
  // Numpad-style direction keys: applies to the LAST balcony card.
  if (/^[1-9]$/.test(e.key)) {
    const dirKey = NUMPAD_TO_KEY[e.key];
    if (!dirKey) return; // 5 is the no-op center
    const cards = document.querySelectorAll('.balcony-card');
    const target = cards[cards.length - 1];
    if (target) {
      const btn = target.querySelector(`.dir-btn[data-key="${dirKey}"]`);
      if (btn) btn.click();
    }
    e.preventDefault();
  }
});

// Boot: jump to first pending (or first overall if all done)
const firstPending = GROUPS.findIndex(g => !isDone(g));
currentIdx = firstPending >= 0 ? firstPending : 0;
renderAll();
</script>
</body>
</html>
